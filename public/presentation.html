<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mushroom illusion Slides</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1217;
        --panel: #171a20;
        --line: #2a2f38;
        --text: #ecf2fb;
        --muted: #9aa8bb;
        --accent: #7c5cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(ellipse at top, #1a1f2a 0%, var(--bg) 60%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .deck {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        max-width: 1080px;
        margin: 0 auto;
        padding: 18px 16px 24px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .lang, .nav {
        display: flex;
        gap: 8px;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #1b1f28;
        color: var(--text);
        padding: 8px 12px;
        cursor: pointer;
      }
      button.active {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border-color: transparent;
      }
      .slide {
        flex: 1;
        margin-top: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(23, 26, 32, 0.93);
        padding: 28px 26px;
      }
      .kicker {
        color: var(--muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-size: 0.78rem;
      }
      h1 {
        margin: 10px 0 8px;
        font-size: clamp(1.4rem, 2.8vw, 2.2rem);
      }
      .subtitle {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
        max-width: 900px;
      }
      .cols {
        margin-top: 20px;
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        padding: 14px;
      }
      .card h3 {
        margin: 0 0 8px;
        font-size: 1rem;
        color: #d8e0ec;
      }
      .card p, .card li {
        color: var(--muted);
        line-height: 1.5;
      }
      .card ul { margin: 0; padding-left: 18px; }
      .footer {
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
      }
      .links {
        display: flex;
        gap: 10px;
      }
      .links a {
        text-decoration: none;
        color: white;
        background: var(--accent);
        border-radius: 8px;
        padding: 6px 10px;
      }
      @media (max-width: 720px) {
        .topbar { flex-wrap: wrap; }
        .slide { padding: 18px 16px; }
      }
    </style>
  </head>
  <body>
    <main class="deck">
      <div class="topbar">
        <div class="lang">
          <button id="btn-en" class="active" type="button">English</button>
          <button id="btn-zh" type="button">中文</button>
        </div>
        <div class="nav">
          <button id="prev" type="button">◀</button>
          <button id="next" type="button">▶</button>
        </div>
      </div>

      <section class="slide">
        <p id="kicker" class="kicker"></p>
        <h1 id="title"></h1>
        <p id="subtitle" class="subtitle"></p>
        <div class="cols">
          <article class="card">
            <h3 id="b1t"></h3>
            <ul>
              <li id="b1a"></li>
              <li id="b1b"></li>
              <li id="b1c"></li>
            </ul>
          </article>
          <article class="card">
            <h3 id="b2t"></h3>
            <p id="b2d"></p>
          </article>
        </div>
      </section>

      <div class="footer">
        <div id="pager">1 / 6</div>
        <div class="links">
          <a href="./">Open App</a>
          <a href="https://github.com/JJJJiris/Mushroom-illusion-" target="_blank" rel="noreferrer">GitHub</a>
          <a href="https://youtu.be/SCf96BqlORY" target="_blank" rel="noreferrer">Demo Video / 使用说明视频</a>
        </div>
      </div>
    </main>

    <script>

          },
          {
            kicker: "Slide 2",

              "Designers need many coherent but non-repetitive backgrounds in poster and campaign workflows.",

            b1b: "Hard to keep style consistency",
            b1c: "Export workflow is fragmented",
            b2t: "Response",
            b2d: "Integrate gesture input, visual generation, and export into one streamlined interface.",
          },
          {

              "The tool supports concepting, style alignment, and delivery for static and motion outputs.",
            b1t: "Where it fits",

            b1b: "Visual direction comparison",
            b1c: "Final asset generation",

          },
          {

            subtitle:
              "Interaction first, visual behavior second, control layer third, export layer last.",
            b1t: "Method",
            b1a: "Gesture as invisible spine",
            b1b: "Diffuse flow follows path logic",
            b1c: "Parameters make outcomes controllable",
            b2t: "Outcome",
            b2d: "A balance between creative freedom and repeatable visual quality.",
          },
          {
            kicker: "Slide 5",
            title: "Key UI/UX Decisions",
            subtitle:
              "The interface is optimized for single-screen operation and low cognitive load.",
            b1t: "Decisions",
            b1a: "Tabbed sidebar to avoid long scrolling",
            b1b: "High-frequency controls grouped by task",
            b1c: "Bilingual boot screen and style presets",
            b2t: "Why",
            b2d: "Keep users focused on visual exploration instead of interface complexity.",
          },
          {
            kicker: "Slide 6",
            title: "Summary",
            subtitle:
              "Mushroom illusion connects ideation and deliverables in one design-oriented workflow.",
            b1t: "Project value",
            b1a: "Faster visual experimentation",
            b1b: "Consistent style control",
            b1c: "Ready-to-use output formats",
            b2t: "Next step",
            b2d: "Continue improving presentation polish and project documentation for final class submission.",
          },
        ],
        zh: [
          {
            kicker: "第 1 页",
            title: "项目概述",
            subtitle: "Mushroom illusion 是一个用于视觉传达设计的手势驱动弥散画布工具。",
            b1t: "核心定位",

          {

          },
          {

          },
          {
            kicker: "第 4 页",
            title: "设计思考过程",
            subtitle: "先交互、再视觉行为、再参数控制、最后完善导出层。",
            b1t: "方法",
            b1a: "把手势设为隐形脊线",

            b2t: "结果",
            b2d: "在创作自由度与输出稳定性之间取得平衡。",
          },
          {
            kicker: "第 5 页",
            title: "关键 UI/UX 决策",
            subtitle: "界面围绕单屏操作和低认知负担进行优化。",
            b1t: "决策",
            b1a: "侧栏分页，避免长滚动",
            b1b: "高频控件按任务集中",
            b1c: "双语进入页与风格预设",
            b2t: "原因",
            b2d: "减少操作阻力，让用户聚焦视觉探索而不是界面学习。",
          },
          {
            kicker: "第 6 页",
            title: "总结",
            subtitle: "Mushroom illusion 把创意探索与素材交付串成一体化设计流程。",
            b1t: "项目价值",
            b1a: "更快的视觉试验",
            b1b: "更稳定的风格控制",
            b1c: "更直接的可交付导出",
            b2t: "下一步",
            b2d: "继续优化展示细节与文档，完成课程最终提交。",
          },
        ],
      };

      let lang = "en";
      let idx = 0;

      function render() {
        const s = slides[lang][idx];
        for (const k of Object.keys(s)) {
          const el = document.getElementById(k);
          if (el) el.textContent = s[k];
        }
        document.getElementById("pager").textContent = `${idx + 1} / ${slides[lang].length}`;
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      }

      function move(delta) {
        const len = slides[lang].length;
        idx = (idx + delta + len) % len;
        render();
      }

      const btnEn = document.getElementById("btn-en");
      const btnZh = document.getElementById("btn-zh");
      const btnPrev = document.getElementById("prev");
      const btnNext = document.getElementById("next");

      btnEn.addEventListener("click", () => {
        lang = "en";
        btnEn.classList.add("active");
        btnZh.classList.remove("active");
        render();
      });
      btnZh.addEventListener("click", () => {
        lang = "zh";
        btnZh.classList.add("active");
        btnEn.classList.remove("active");
        render();
      });
      btnPrev.addEventListener("click", () => move(-1));
      btnNext.addEventListener("click", () => move(1));
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") move(1);
        if (e.key === "ArrowLeft") move(-1);
      });

      render();
    </script>
  </body>
</html>
